
name: Gerar APK Sakura Life

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extrair aplicativo
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'Sakura-Life-Android-pronto.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          HTML_FILE=$(find extracted -type f -iname 'index.html' -print -quit)
          if [ -z "$HTML_FILE" ]; then
            HTML_FILE=$(find extracted -type f -iname '*.html' -print -quit)
          fi
          mkdir www
          cp "$HTML_FILE" www/index.html

      - name: Criar aplicativo Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.sakuralife.app","appName":"Sakura Life","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakura-Life-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
